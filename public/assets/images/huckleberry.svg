<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 120" width="160" height="120" aria-label="Wild Mountain Huckleberry">
  <defs>
    <radialGradient id="huckGrad1" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#5B4884"/>
      <stop offset="40%" stop-color="#2D1C4D"/>
      <stop offset="90%" stop-color="#150B28"/>
      <stop offset="100%" stop-color="#0A0414"/>
    </radialGradient>
    <radialGradient id="huckGrad2" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#6F5899"/>
      <stop offset="50%" stop-color="#341E59"/>
      <stop offset="100%" stop-color="#0E051C"/>
    </radialGradient>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#55A03A"/>
      <stop offset="60%" stop-color="#2E691B"/>
      <stop offset="100%" stop-color="#1B420F"/>
    </linearGradient>
    <filter id="fruitShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <g filter="url(#fruitShadow)">
    <!-- Leaves in background -->
    <path d="M 80 50 C 60 20 100 10 125 22 C 130 35 110 55 80 50 Z" fill="url(#leafGrad)"/>
    <path d="M 80 50 C 45 40 40 15 60 8 C 80 8 85 30 80 50 Z" fill="url(#leafGrad)"/>
    <path d="M 80 50 L 115 25" stroke="#7AC654" stroke-width="1.5" fill="none" opacity="0.6"/>

    <!-- Left berry -->
    <circle cx="62" cy="72" r="26" fill="url(#huckGrad1)"/>
    <ellipse cx="58" cy="62" rx="7" ry="4" fill="#ffffff" opacity="0.25" transform="rotate(-20 58 62)"/>
    <!-- Calyx crown -->
    <circle cx="54" cy="78" r="5" fill="#150824" stroke="#48326D" stroke-width="1.5"/>

    <!-- Right berry -->
    <circle cx="102" cy="68" r="28" fill="url(#huckGrad2)"/>
    <ellipse cx="98" cy="58" rx="8" ry="4" fill="#ffffff" opacity="0.3" transform="rotate(-15 98 58)"/>
    <!-- Calyx crown -->
    <circle cx="112" cy="72" r="6" fill="#150824" stroke="#48326D" stroke-width="1.5"/>

    <!-- Middle front berry -->
    <circle cx="82" cy="85" r="24" fill="url(#huckGrad1)"/>
    <ellipse cx="78" cy="78" rx="6" ry="3" fill="#ffffff" opacity="0.2" transform="rotate(-10 78 78)"/>
    <circle cx="82" cy="94" r="4.5" fill="#150824" stroke="#48326D" stroke-width="1.5"/>
  </g>
</svg>
