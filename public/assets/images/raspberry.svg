<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 120" width="160" height="120" aria-label="Pacific Wild Raspberry">
  <defs>
    <radialGradient id="drupGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FF4066"/>
      <stop offset="50%" stop-color="#D91642"/>
      <stop offset="90%" stop-color="#8F0523"/>
    </radialGradient>
    <filter id="raspShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <g filter="url(#raspShadow)">
    <!-- Green serrated leaf -->
    <path d="M 80 50 C 70 30 110 20 130 35 C 135 55 105 60 80 50 Z" fill="#3D7D24"/>
    <path d="M 80 50 C 45 40 40 20 58 12 C 75 14 78 35 80 50 Z" fill="#4B962D"/>

    <!-- Left berry -->
    <g transform="translate(48, 55)">
      <!-- Drupelets -->
      <circle cx="20" cy="10" r="7" fill="url(#drupGrad)"/>
      <circle cx="30" cy="10" r="7" fill="url(#drupGrad)"/>
      <circle cx="14" cy="20" r="7" fill="url(#drupGrad)"/>
      <circle cx="25" cy="20" r="7.5" fill="url(#drupGrad)"/>
      <circle cx="36" cy="20" r="7" fill="url(#drupGrad)"/>
      <circle cx="16" cy="30" r="7" fill="url(#drupGrad)"/>
      <circle cx="27" cy="30" r="7.5" fill="url(#drupGrad)"/>
      <circle cx="36" cy="30" r="7" fill="url(#drupGrad)"/>
      <circle cx="22" cy="40" r="6.5" fill="url(#drupGrad)"/>
      <circle cx="31" cy="40" r="6.5" fill="url(#drupGrad)"/>
      <circle cx="26" cy="48" r="5.5" fill="url(#drupGrad)"/>
    </g>

    <!-- Right berry -->
    <g transform="translate(86, 52)">
      <circle cx="18" cy="12" r="7" fill="url(#drupGrad)"/>
      <circle cx="28" cy="12" r="7" fill="url(#drupGrad)"/>
      <circle cx="12" cy="22" r="7" fill="url(#drupGrad)"/>
      <circle cx="23" cy="22" r="7.5" fill="url(#drupGrad)"/>
      <circle cx="34" cy="22" r="7" fill="url(#drupGrad)"/>
      <circle cx="15" cy="32" r="7" fill="url(#drupGrad)"/>
      <circle cx="26" cy="32" r="7.5" fill="url(#drupGrad)"/>
      <circle cx="35" cy="32" r="7" fill="url(#drupGrad)"/>
      <circle cx="20" cy="42" r="6.5" fill="url(#drupGrad)"/>
      <circle cx="30" cy="42" r="6.5" fill="url(#drupGrad)"/>
      <circle cx="25" cy="49" r="5.5" fill="url(#drupGrad)"/>
    </g>
  </g>
</svg>
