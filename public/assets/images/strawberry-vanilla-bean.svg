<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 120" width="160" height="120" aria-label="Strawberry Vanilla Bean">
  <defs>
    <radialGradient id="strawGrad" cx="38%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#FF4B4B"/>
      <stop offset="45%" stop-color="#E6172A"/>
      <stop offset="85%" stop-color="#9E0615"/>
    </radialGradient>
    <linearGradient id="vanillaPod" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#2B1A13"/>
      <stop offset="50%" stop-color="#4A3022"/>
      <stop offset="100%" stop-color="#1A0E08"/>
    </linearGradient>
    <filter id="strawShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <g filter="url(#strawShadow)">
    <!-- Dark vanilla bean pod curved underneath -->
    <path d="M 25 95 Q 80 85 145 78" stroke="url(#vanillaPod)" stroke-width="5" stroke-linecap="round" fill="none"/>
    <path d="M 28 102 Q 85 92 140 85" stroke="url(#vanillaPod)" stroke-width="4" stroke-linecap="round" fill="none"/>

    <!-- Left Strawberry -->
    <g transform="translate(35, 40)">
      <!-- Calyx leaves -->
      <polygon points="25,12 18,2 25,6" fill="#3D7D24"/>
      <polygon points="25,12 28,0 31,6" fill="#4B962D"/>
      <polygon points="25,12 38,4 32,8" fill="#3D7D24"/>
      <!-- Body -->
      <path d="M 12 18 C 10 35 22 55 28 58 C 34 55 46 35 44 18 C 40 12 16 12 12 18 Z" fill="url(#strawGrad)"/>
      <!-- Seeds -->
      <circle cx="20" cy="25" r="1" fill="#FFD700"/>
      <circle cx="28" cy="25" r="1" fill="#FFD700"/>
      <circle cx="36" cy="25" r="1" fill="#FFD700"/>
      <circle cx="16" cy="35" r="1" fill="#FFD700"/>
      <circle cx="24" cy="35" r="1" fill="#FFD700"/>
      <circle cx="32" cy="35" r="1" fill="#FFD700"/>
      <circle cx="20" cy="45" r="1" fill="#FFD700"/>
      <circle cx="28" cy="45" r="1" fill="#FFD700"/>
    </g>

    <!-- Right Strawberry -->
    <g transform="translate(70, 36)">
      <polygon points="28,14 20,4 28,8" fill="#3D7D24"/>
      <polygon points="28,14 32,2 35,8" fill="#4B962D"/>
      <polygon points="28,14 42,6 36,10" fill="#3D7D24"/>
      <path d="M 14 20 C 12 38 25 60 32 63 C 39 60 52 38 50 20 C 46 14 18 14 14 20 Z" fill="url(#strawGrad)"/>
      <circle cx="22" cy="28" r="1.1" fill="#FFD700"/>
      <circle cx="32" cy="28" r="1.1" fill="#FFD700"/>
      <circle cx="42" cy="28" r="1.1" fill="#FFD700"/>
      <circle cx="18" cy="40" r="1.1" fill="#FFD700"/>
      <circle cx="28" cy="40" r="1.1" fill="#FFD700"/>
      <circle cx="38" cy="40" r="1.1" fill="#FFD700"/>
      <circle cx="24" cy="50" r="1.1" fill="#FFD700"/>
      <circle cx="34" cy="50" r="1.1" fill="#FFD700"/>
    </g>
  </g>
</svg>
