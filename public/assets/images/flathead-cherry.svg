<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 120" width="160" height="120" aria-label="Flathead Cherry">
  <defs>
    <radialGradient id="cherryGrad1" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#E51C34"/>
      <stop offset="45%" stop-color="#A8071A"/>
      <stop offset="85%" stop-color="#5C000B"/>
      <stop offset="100%" stop-color="#2E0005"/>
    </radialGradient>
    <radialGradient id="cherryGrad2" cx="40%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#F22E45"/>
      <stop offset="50%" stop-color="#B50B20"/>
      <stop offset="90%" stop-color="#6E020F"/>
    </radialGradient>
    <linearGradient id="cherryStem" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#709632"/>
      <stop offset="100%" stop-color="#3D5915"/>
    </linearGradient>
    <filter id="cherryShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <g filter="url(#cherryShadow)">
    <!-- Leaves at stem junction -->
    <path d="M 85 24 C 60 10 70 3 95 10 C 105 18 95 28 85 24 Z" fill="#4B8224"/>
    <path d="M 85 24 L 98 12" stroke="#89C455" stroke-width="1.2" fill="none"/>

    <!-- Left stem -->
    <path d="M 85 24 C 70 42 55 52 58 70" stroke="url(#cherryStem)" stroke-width="3" stroke-linecap="round" fill="none"/>
    <!-- Right stem -->
    <path d="M 85 24 C 95 40 105 48 108 68" stroke="url(#cherryStem)" stroke-width="3" stroke-linecap="round" fill="none"/>

    <!-- Left Cherry -->
    <path d="M 58 66 C 40 64 30 80 34 94 C 38 106 52 110 60 108 C 70 106 78 98 76 86 C 74 74 68 66 58 66 Z" fill="url(#cherryGrad1)"/>
    <ellipse cx="48" cy="76" rx="6" ry="3.5" fill="#ffffff" opacity="0.4" transform="rotate(-30 48 76)"/>

    <!-- Right Cherry -->
    <path d="M 108 64 C 92 62 82 76 86 92 C 90 104 104 108 114 106 C 124 104 132 94 130 82 C 128 72 120 64 108 64 Z" fill="url(#cherryGrad2)"/>
    <ellipse cx="98" cy="74" rx="7" ry="4" fill="#ffffff" opacity="0.45" transform="rotate(-25 98 74)"/>
  </g>
</svg>
