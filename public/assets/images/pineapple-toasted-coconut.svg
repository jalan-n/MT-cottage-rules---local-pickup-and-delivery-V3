<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 120" width="160" height="120" aria-label="Pineapple Toasted Coconut">
  <defs>
    <linearGradient id="pineBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD034"/>
      <stop offset="50%" stop-color="#EAA112"/>
      <stop offset="100%" stop-color="#BD7405"/>
    </linearGradient>
    <radialGradient id="coconutMeat" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="70%" stop-color="#F2EDE4"/>
      <stop offset="100%" stop-color="#D9CBB6"/>
    </radialGradient>
    <filter id="tropicalShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <g filter="url(#tropicalShadow)">
    <!-- Crown leaves of pineapple -->
    <path d="M 45 42 L 30 15 L 42 32 Z" fill="#2E691B"/>
    <path d="M 48 40 L 44 8 L 52 28 Z" fill="#4B962D"/>
    <path d="M 52 42 L 65 14 L 56 34 Z" fill="#2E691B"/>

    <!-- Pineapple Body cut slice / half -->
    <ellipse cx="50" cy="68" rx="26" ry="32" fill="url(#pineBody)"/>
    <!-- Diamond texture -->
    <path d="M 32 58 L 68 78 M 32 72 L 64 88 M 38 84 L 58 94" stroke="#8A5100" stroke-width="1.2" opacity="0.6"/>
    <path d="M 68 58 L 32 78 M 68 72 L 36 88 M 62 84 L 42 94" stroke="#8A5100" stroke-width="1.2" opacity="0.6"/>

    <!-- Half Coconut next to it -->
    <!-- Outer Brown Shell -->
    <circle cx="108" cy="74" r="28" fill="#543118"/>
    <!-- Inner White Meat -->
    <circle cx="108" cy="74" r="22" fill="url(#coconutMeat)"/>
    <!-- Hollow Center -->
    <circle cx="108" cy="74" r="14" fill="#3D200E"/>
    <!-- Toasted coconut shavings -->
    <path d="M 94 88 Q 102 96 114 90" stroke="#BD8C53" stroke-width="2" stroke-linecap="round" fill="none"/>
    <path d="M 116 88 Q 124 94 130 84" stroke="#8C5C28" stroke-width="2" stroke-linecap="round" fill="none"/>
    <path d="M 90 78 Q 98 84 94 92" stroke="#BD8C53" stroke-width="2" stroke-linecap="round" fill="none"/>
  </g>
</svg>
