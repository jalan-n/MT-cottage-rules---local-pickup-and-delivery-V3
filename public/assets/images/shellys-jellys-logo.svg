<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 90" width="280" height="90" aria-label="Shelly's Jellys LLC Logo">
  <defs>
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7A1D0E"/>
      <stop offset="100%" stop-color="#541208"/>
    </linearGradient>
  </defs>
  <style>
    .script-text { font-family: 'Caveat', 'Playball', 'Brush Script MT', 'Dancing Script', cursive; font-size: 52px; font-weight: 700; fill: url(#logoGrad); }
    .sub-llc { font-family: system-ui, sans-serif; font-size: 13px; font-weight: 800; fill: #7A1D0E; letter-spacing: 1px; }
    .swash { stroke: #7A1D0E; stroke-width: 2.5; stroke-linecap: round; fill: none; }
  </style>
  <g transform="translate(10, 52)">
    <text x="0" y="0" class="script-text">Shelly's</text>
    <text x="12" y="30" class="script-text">Jellys</text>
    <text x="145" y="24" class="sub-llc">LLC</text>
    <path d="M 8 36 Q 70 42 140 34" class="swash" />
    <!-- Small heart berry accent -->
    <path d="M 148 30 C 148 27 151 25 154 27 C 157 25 160 27 160 30 C 160 34 154 38 154 38 C 154 38 148 34 148 30 Z" fill="#800020" />
  </g>
</svg>
