<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 400" width="320" height="400" aria-label="Artisan Glass Mason Jar filled with Gourmet Jam">
  <defs>
    <!-- Jam gradient -->
    <linearGradient id="jamBody" x1="0%" y1="0%" x2="100%" y2="80%">
      <stop offset="0%" stop-color="#4A0012"/>
      <stop offset="35%" stop-color="#73051F"/>
      <stop offset="70%" stop-color="#550215"/>
      <stop offset="100%" stop-color="#2D000A"/>
    </linearGradient>
    <!-- Metal lid gradient -->
    <linearGradient id="metalLid" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8E8E93"/>
      <stop offset="25%" stop-color="#E5E5EA"/>
      <stop offset="50%" stop-color="#F2F2F7"/>
      <stop offset="75%" stop-color="#D1D1D6"/>
      <stop offset="100%" stop-color="#8E8E93"/>
    </linearGradient>
    <!-- Glass sheen -->
    <linearGradient id="glassHighlight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.45"/>
      <stop offset="30%" stop-color="#ffffff" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <!-- Soft shadow -->
    <filter id="softShadow" x="-20%" y="-10%" width="140%" height="130%">
      <feDropShadow dx="0" dy="18" stdDeviation="14" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <g filter="url(#softShadow)">
    <!-- Jar glass body -->
    <path d="M 68 85 C 68 85, 60 100, 52 140 C 44 190, 46 310, 55 345 C 60 365, 80 375, 160 375 C 240 375, 260 365, 265 345 C 274 310, 276 190, 268 140 C 260 100, 252 85, 252 85 Z" fill="url(#jamBody)"/>

    <!-- Embossed Fruit Pattern inside glass -->
    <circle cx="160" cy="210" r="54" fill="none" stroke="#8A0D2A" stroke-width="3" opacity="0.6"/>
    <path d="M 145 195 C 135 185 130 220 150 230 C 170 240 180 210 165 195 C 155 185 155 190 145 195 Z" fill="#991534" opacity="0.5"/>
    <circle cx="175" cy="218" r="14" fill="#991534" opacity="0.6"/>
    <circle cx="140" cy="212" r="12" fill="#991534" opacity="0.6"/>
    <path d="M 152 186 C 158 174 168 170 174 172" stroke="#991534" stroke-width="2.5" fill="none" opacity="0.6"/>

    <!-- Left curved glass highlight reflection -->
    <path d="M 72 135 C 64 175, 66 280, 74 340 C 76 345, 84 345, 84 340 C 76 280, 74 175, 82 135 Z" fill="url(#glassHighlight)"/>

    <!-- Right soft glass reflection -->
    <path d="M 248 140 C 254 180, 252 270, 246 330" stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.2" fill="none"/>

    <!-- Jar Neck / Thread -->
    <rect x="76" y="65" width="168" height="22" rx="4" fill="#5A5A5F"/>

    <!-- Canning Lid Top -->
    <ellipse cx="160" cy="40" rx="84" ry="12" fill="url(#metalLid)"/>
    <!-- Canning Lid Ring Band -->
    <path d="M 74 40 L 74 65 C 74 72, 246 72, 246 65 L 246 40 Z" fill="url(#metalLid)"/>
    <!-- Thread lines on band -->
    <line x1="74" y1="48" x2="246" y2="48" stroke="#AEAEB2" stroke-width="1.5"/>
    <line x1="74" y1="56" x2="246" y2="56" stroke="#AEAEB2" stroke-width="1.5"/>

    <!-- Vertical knurling ribs on ring -->
    <line x1="86" y1="42" x2="86" y2="65" stroke="#7C7C80" stroke-width="1.5"/>
    <line x1="96" y1="43" x2="96" y2="66" stroke="#7C7C80" stroke-width="1.5"/>
    <line x1="106" y1="44" x2="106" y2="67" stroke="#7C7C80" stroke-width="1.5"/>
    <line x1="214" y1="44" x2="214" y2="67" stroke="#7C7C80" stroke-width="1.5"/>
    <line x1="224" y1="43" x2="224" y2="66" stroke="#7C7C80" stroke-width="1.5"/>
    <line x1="234" y1="42" x2="234" y2="65" stroke="#7C7C80" stroke-width="1.5"/>
  </g>
</svg>
